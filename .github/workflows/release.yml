name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Smoke test CLI
        run: node bin/zalo-mcp.mjs
      - run: npm pack
      - uses: softprops/action-gh-release@v3
        with:
          files: "*.tgz"
          generate_release_notes: true
